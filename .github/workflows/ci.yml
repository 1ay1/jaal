name: ci

on:
  push:
  pull_request:

# jaal relies on C++26 features (structured binding packs, = delete("reason"),
# computed static_assert messages, __builtin_structured_binding_size). Those
# need GCC 16 / clang 22. Stock ubuntu runners ship older compilers, so the
# Linux jobs run in an Arch container, which carries current ones.

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, clang, asan, tsan]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: toolchain
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja ccache gcc clang lld zig
      - uses: actions/checkout@v4
      - name: versions
        run: g++ --version | head -1; clang++ --version | head -1; cmake --version | head -1
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j
      - name: test
        # tsan needs the ASLR layout it expects; containers sometimes don't
        # give it. A tsan failure that says "unexpected memory mapping" is
        # the runner, not jaal.
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --timeout 180

  windows-cross:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: toolchain
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja ccache wine curl xz
          curl -sSL -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz
          mkdir -p "$HOME/.local/opt"
          tar -xf /tmp/llvm-mingw.tar.xz -C "$HOME/.local/opt"
          ln -sfn "$HOME/.local/opt/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64" "$HOME/.local/opt/llvm-mingw"
      - uses: actions/checkout@v4
      - run: cmake --preset mingw
      - run: cmake --build --preset mingw -j
      - name: test (under wine)
        # In a container job, $HOME (/github/home) isn't owned by the user
        # the steps run as, and wine refuses to create its prefix there.
        # Give it one in the workspace.
        run: |
          export WINEPREFIX="$GITHUB_WORKSPACE/.wine"
          export WINEDEBUG=-all
          wineboot --init >/dev/null 2>&1 || true
          ctest --test-dir build/mingw --output-on-failure --timeout 180
